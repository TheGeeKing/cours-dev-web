services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - app_db:/app/db.sqlite
      - app_uploads:/app/uploads
    restart: unless-stopped

volumes:
  app_db:
  app_uploads:
